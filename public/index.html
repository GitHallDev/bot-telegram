<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lecteur Anime</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <div class="bg-backdrop"></div>

    <div class="player-shell">
        <div class="window-topbar">
            <span class="traffic traffic-red"></span>
            <span class="traffic traffic-yellow"></span>
            <span class="traffic traffic-green"></span>
        </div>

        <div class="player-window">
            <div class="video-title" id="videoTitle">Chargement...</div>

            <iframe
                id="videoPlayer"
                title="Lecteur vidéo"
                allow="autoplay; fullscreen; picture-in-picture"
                referrerpolicy="no-referrer-when-downgrade"
                loading="lazy"
            ></iframe>

            <div class="controls-panel">
                <div class="time-row">
                    <span id="currentTime">0:04</span>
                    <input id="progressBar" type="range" min="0" max="100" value="0" />
                    <span id="durationTime">0:07</span>
                </div>

                <div class="bottom-row">
                    <div class="left-controls">
                        <button class="icon-btn" id="volumeBtn" aria-label="Volume">🔊</button>
                        <div class="volume-wrap">
                            <input id="volumeBar" type="range" min="0" max="100" value="80" />
                        </div>
                    </div>

                    <div class="center-controls">
                        <button class="nav-btn" id="prevBtn" aria-label="Précédent">⏮</button>
                        <button class="nav-btn play-btn" id="playBtn" aria-label="Lire / Pause">⏸</button>
                        <button class="nav-btn" id="nextBtn" aria-label="Suivant">⏭</button>
                    </div>

                    <div class="right-controls">
                        <button class="icon-btn" id="sourceBtn" aria-label="Source">⏺</button>
                        <button class="icon-btn" id="settingsBtn" aria-label="Réglages">⚙</button>
                        <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="source-panel">
            <label for="sourceSelect">Source :</label>
            <select id="sourceSelect">
                <option>Chargement...</option>
            </select>
        </div>
    </div>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg) tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const animeUrl = urlParams.get('animeUrl') || '';
        const seasonUrl = urlParams.get('seasonUrl') || '';
        const seasonName = urlParams.get('season') || 'Saison';
        const epNum = urlParams.get('ep') || '1';
        const lang = (urlParams.get('lang') || 'vostfr').toUpperCase();
        const animeTitle = urlParams.get('animeTitle') || 'Anime';

        const videoTitle = document.getElementById('videoTitle');
        const videoPlayer = document.getElementById('videoPlayer');
        const sourceSelect = document.getElementById('sourceSelect');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        const playBtn = document.getElementById('playBtn');
        const volumeBar = document.getElementById('volumeBar');

        const state = {
            links: [],
            active: 0,
        };

        function formatTime(seconds) {
            if (!Number.isFinite(seconds) || seconds < 0) return '0:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${String(s).padStart(2, '0')}`;
        }

        function setVideoTitle() {
            const selected = state.links[state.active];
            const label = selected ? selected.host : 'Source';
            videoTitle.textContent = `${animeTitle || seasonName} · ${label}`;
        }

        function renderSources() {
            if (!state.links.length) {
                sourceSelect.innerHTML = '<option>Aucune source disponible</option>';
                return;
            }

            sourceSelect.innerHTML = state.links
                .map((link, index) => `<option value="${index}">${link.host}</option>`)
                .join('');

            sourceSelect.value = String(state.active);
            setVideoTitle();
        }

        function loadSelectedSource(index) {
            const link = state.links[index];
            if (!link) return;

            state.active = index;
            sourceSelect.value = String(index);
            setVideoTitle();

            const safeUrl = link.url.trim();
            videoPlayer.src = safeUrl;
            if (videoPlayer.contentWindow) {
                try {
                    videoPlayer.contentWindow.focus();
                } catch (e) {
                    // Certaines sources ne permettent pas le focus direct via iframe.
                }
            }
        }

        async function fetchEpisodeLinks() {
            try {
                const query = new URLSearchParams({
                    animeUrl,
                    seasonUrl,
                    seasonName,
                    ep: epNum,
                    lang: lang.toLowerCase(),
                    animeTitle,
                });

                const response = await fetch(`/api/episodes?${query.toString()}`);
                const data = await response.json();

                if (!data.success || !data.links || !data.links.length) {
                    videoTitle.textContent = 'Aucune source disponible';
                    sourceSelect.innerHTML = '<option>Aucune source</option>';
                    return;
                }

                state.links = data.links;
                renderSources();
                loadSelectedSource(0);
            } catch (error) {
                console.error(error);
                videoTitle.textContent = 'Erreur de chargement';
                sourceSelect.innerHTML = '<option>Erreur</option>';
            }
        }

        sourceSelect.addEventListener('change', (event) => {
            const index = Number(event.target.value);
            if (!Number.isNaN(index)) loadSelectedSource(index);
        });

        playBtn.addEventListener('click', () => {
            const link = state.links[state.active];
            if (link) window.open(link.url, '_blank', 'noopener,noreferrer');
        });

        progressBar.addEventListener('input', () => {
            // Le lecteur est intégralement affiché dans un iframe, donc la barre de progression
            // est stylée comme un contrôle visuel mais la lecture reste pilotée par la source embed.
            const value = Number(progressBar.value);
            progressBar.style.setProperty('--value', `${(value / (progressBar.max || 100)) * 100}%`);
        });

        volumeBar.addEventListener('input', () => {
            const value = Number(volumeBar.value) / 100;
            volumeBar.style.setProperty('--value', `${value * 100}%`);
        });
        document.getElementById('sourceBtn').addEventListener('click', () => {
            sourceSelect.focus();
        });

        document.getElementById('settingsBtn').addEventListener('click', () => {
            alert('Réglages de lecture à venir');
        });

        document.getElementById('menuBtn').addEventListener('click', () => {
            alert('Menu à venir');
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            const nextIndex = state.active > 0 ? state.active - 1 : 0;
            loadSelectedSource(nextIndex);
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            if (!state.links.length) return;
            const nextIndex = state.active < state.links.length - 1 ? state.active + 1 : 0;
            loadSelectedSource(nextIndex);
        });

        fetchEpisodeLinks();
    </script>
</body>
</html>
