<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Lecteur Anime</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <main class="page">
        <header class="header">
            <h1 id="animeTitle">Chargement…</h1>
            <p id="episodeMeta" class="meta"></p>
        </header>

        <section class="sources">
            <label class="sr-only" for="sourceSelect">Lecteur</label>
            <select id="sourceSelect" class="select" aria-label="Lecteur">
                <option>Chargement…</option>
            </select>
            <div class="source-actions" id="sourceActions" hidden>
                <a id="openBtn" class="icon-btn" href="#" target="_blank" rel="noopener noreferrer" title="Ouvrir la source" aria-label="Ouvrir la source dans un nouvel onglet">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
                </a>
                <button id="copyBtn" class="icon-btn" type="button" title="Copier le lien" aria-label="Copier le lien de la source">
                    <svg class="ico-copy" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
                    <svg class="ico-check" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
                </button>
                <button id="downloadBtn" class="icon-btn" type="button" title="Télécharger la source" aria-label="Télécharger la source">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11"/><path d="M7 20l5 5 5-5"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
                </button>
                <button id="fsBtn" class="icon-btn" type="button" title="Plein écran paysage" aria-label="Plein écran en mode paysage">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5"/><path d="M20 9V4h-5"/><path d="M4 15v5h5"/><path d="M20 15v5h-5"/></svg>
                </button>
            </div>


            <!-- Options de téléchargement (Qualité & Format) -->
            <div class="download-options" id="downloadOptions" hidden>
                <div class="download-row">
                    <select id="qualitySelect" class="select-sm" aria-label="Qualité">
                        <option value="best">Max (Auto)</option>
                        <option value="1080">1080p (HD)</option>
                        <option value="720">720p (SD)</option>
                        <option value="360">360p (Low)</option>
                    </select>
                    <select id="formatSelect" class="select-sm" aria-label="Format">
                        <option value="mp4">MP4</option>
                        <option value="mkv">MKV</option>
                    </select>
                    <button id="closeDownloadBtn" class="icon-btn-sm" type="button" title="Masquer les options" aria-label="Masquer les options">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"/></svg>
                    </button>
                    <button id="validateDownloadBtn" class="icon-btn validate-btn" type="button" title="Valider le téléchargement" aria-label="Valider le téléchargement">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
                    </button>
                </div>
                <div id="videoSizeText" class="download-size">📊 Taille estimée : calcul…</div>
            </div>
        </section>

        <section class="player" id="playerBox">
            <iframe
                id="videoPlayer"
                title="Lecteur vidéo"
                allow="autoplay; fullscreen; picture-in-picture"
                allowfullscreen
                referrerpolicy="no-referrer-when-downgrade"
            ></iframe>
            <button id="fsExit" class="fs-exit" type="button" aria-label="Quitter le plein écran" hidden>
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
            <div class="player-state" id="playerState">
                <span class="spinner" aria-hidden="true"></span>
                <p>Chargement du lecteur…</p>
            </div>
        </section>


    </main>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            try {
                tg.setHeaderColor('#0d0d0f');
                tg.setBackgroundColor('#0d0d0f');
            } catch (e) { /* version Telegram plus ancienne */ }
        }

        const params = new URLSearchParams(window.location.search);
        const animeUrl = params.get('animeUrl') || '';
        const seasonUrl = params.get('seasonUrl') || '';
        const seasonName = params.get('season') || 'Saison';
        const epNum = parseInt(params.get('ep') || '1', 10) || 1;
        const lang = (params.get('lang') || 'vostfr').toLowerCase();
        const animeTitle = params.get('animeTitle') || 'Anime';

        const el = {
            title: document.getElementById('animeTitle'),
            meta: document.getElementById('episodeMeta'),
            player: document.getElementById('videoPlayer'),
            state: document.getElementById('playerState'),
            select: document.getElementById('sourceSelect'),
            actions: document.getElementById('sourceActions'),
            open: document.getElementById('openBtn'),
            copy: document.getElementById('copyBtn'),
            download: document.getElementById('downloadBtn'),
            downloadOptions: document.getElementById('downloadOptions'),
            closeDownload: document.getElementById('closeDownloadBtn'),
            sizeText: document.getElementById('videoSizeText'),
            validateDownload: document.getElementById('validateDownloadBtn'),
            quality: document.getElementById('qualitySelect'),
            format: document.getElementById('formatSelect'),
            box: document.getElementById('playerBox'),
            fs: document.getElementById('fsBtn'),
            fsExit: document.getElementById('fsExit'),
        };

        const state = { links: [], active: 0 };

        async function updateVideoSize() {
            if (!el.sizeText) return;
            const link = state.links[state.active];
            if (!link) {
                el.sizeText.textContent = '📊 Taille estimée : non disponible';
                return;
            }

            const quality = el.quality.value;
            const format = el.format.value;
            el.sizeText.textContent = '📊 Taille estimée : calcul…';

            try {
                const response = await fetch(`/api/video-size?url=${encodeURIComponent(link.url.trim())}&quality=${quality}&format=${format}`);
                const data = await response.json();
                if (data.success) {
                    el.sizeText.textContent = `📊 Taille estimée : ${data.size}`;
                } else {
                    el.sizeText.textContent = '📊 Taille estimée : non disponible';
                }
            } catch (e) {
                el.sizeText.textContent = '📊 Taille estimée : erreur de calcul';
            }
        }

        function setDownloadUi(isOpen) {
            el.downloadOptions.hidden = !isOpen;
            el.download.title = isOpen ? 'Valider le téléchargement' : 'Télécharger la source';
            el.download.setAttribute('aria-label', isOpen ? 'Valider le téléchargement' : 'Télécharger la source');
            if (isOpen) {
                updateVideoSize();
            }
        }

        el.title.textContent = animeTitle;
        el.meta.textContent = `${seasonName} · Épisode ${epNum} · ${lang.toUpperCase()}`;
        document.title = `${animeTitle} – Épisode ${epNum}`;

        function showState(message, isError = false) {
            el.state.hidden = false;
            el.state.classList.toggle('is-error', isError);
            el.state.innerHTML = isError ? '' : '<span class="spinner" aria-hidden="true"></span>';
            const p = document.createElement('p');
            p.textContent = message;
            el.state.appendChild(p);
        }

        function hideState() {
            el.state.hidden = true;
        }

        function renderSources() {
            el.select.innerHTML = '';
            state.links.forEach((link, index) => {
                const opt = document.createElement('option');
                opt.value = String(index);
                opt.textContent = link.host;
                el.select.appendChild(opt);
            });
        }

        function loadSource(index) {
            const link = state.links[index];
            if (!link) return;
            state.active = index;
            const url = link.url.trim();
            el.select.value = String(index);
            el.open.href = url;
            el.actions.hidden = false;
            el.copy.classList.remove('is-copied');
            showState('Chargement du lecteur…');
            el.player.src = url;
        }

        async function copyText(text) {
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch (e) {
                // Repli pour les WebViews sans API presse-papiers (ex. Telegram)
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.cssText = 'position:fixed;opacity:0;';
                document.body.appendChild(ta);
                ta.select();
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (err) { /* ignoré */ }
                ta.remove();
                return ok;
            }
        }

        let copyTimer;
        el.copy.addEventListener('click', async () => {
            const link = state.links[state.active];
            if (!link) return;
            const ok = await copyText(link.url.trim());
            if (!ok) return;
            el.copy.classList.add('is-copied');
            el.copy.title = 'Lien copié';
            clearTimeout(copyTimer);
            copyTimer = setTimeout(() => {
                el.copy.classList.remove('is-copied');
                el.copy.title = 'Copier le lien';
            }, 1800);
        });

        async function startDownload() {
            const link = state.links[state.active];
            if (!link) return;

            const quality = el.quality.value || 'best';
            const format = el.format.value || 'mp4';
            const filename = `${(animeTitle || 'anime').replace(/[^a-z0-9-_]+/gi, '_').replace(/_+/g, '_').replace(/^_|_$/g, '')}-ep${epNum}.${format}`;
            el.download.disabled = true;

            // Affichage d'un indicateur visuel initial
            showState(`⏳ Préparation du téléchargement (${quality}p / ${format.toUpperCase()})…`);

            try {

                            el.download.title = 'Téléchargement...';
            showState('Téléchargement en cours…');

                const response = await fetch('/api/download', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: link.url.trim(), filename, quality, format })
                });
                const data = await response.json();

                if (!response.ok || !data.success) {
                    throw new Error(data.error || 'Téléchargement refusé.');
                }

                // Déclenchement du téléchargement final pour l'utilisateur
                showState('✅ Fichier prêt ! Lancement du téléchargement sur votre appareil...');

                const a = document.createElement('a');
                a.href = data.downloadUrl || '/downloads/' + encodeURIComponent(filename);
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                a.remove();

                setTimeout(() => hideState(), 1800);
            } catch (error) {
                console.error(error);
                showState('Impossible de démarrer le téléchargement.', true);
            } finally {
                el.download.disabled = false;
                setDownloadUi(false);
                el.download.title = 'Télécharger la source';
                el.download.setAttribute('aria-label', 'Télécharger la source');

                showState('Téléchargement terminé ou annulé.', false);
            }
        }

        // Écouter les changements sur les sélecteurs de qualité ou format pour mettre à jour la taille en temps réel
        el.quality.addEventListener('change', updateVideoSize);
        el.format.addEventListener('change', updateVideoSize);

        // Bouton pour fermer/masquer les options
        el.closeDownload.addEventListener('click', () => setDownloadUi(false));

        el.download.addEventListener('click', () => {
            if (el.downloadOptions.hidden) {
                setDownloadUi(true);
                return;
            }
            startDownload();
        });

        el.validateDownload.addEventListener('click', startDownload);

        // ---- Plein écran paysage ----
        const fs = { active: false, pseudo: false, tgFs: false };
        const tgHas = (v) => tg && tg.isVersionAtLeast && tg.isVersionAtLeast(v);

        async function enterLandscape() {
            fs.active = true;
            // 1) Plein écran natif (Android, desktop) + verrouillage en paysage
            const req = el.box.requestFullscreen || el.box.webkitRequestFullscreen;
            if (req) {
                try {
                    await req.call(el.box);
                    try { await screen.orientation.lock('landscape'); } catch (e) { /* non supporté (iOS) */ }
                    return;
                } catch (e) { /* on passe au plan B */ }
            }
            // 2) Plan B : plein écran Telegram + mode "pseudo" pivoté si on est en portrait
            if (tgHas('8.0')) {
                try { tg.requestFullscreen(); fs.tgFs = true; } catch (e) {}
                try { tg.lockOrientation(); } catch (e) {}
            }
            fs.pseudo = true;
            document.body.classList.add('pseudo-fs');
            el.fsExit.hidden = false;
        }

        function exitLandscape() {
            if (!fs.active) return;
            fs.active = false;
            if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); }
            else if (document.webkitFullscreenElement && document.webkitExitFullscreen) { document.webkitExitFullscreen(); }
            try { screen.orientation.unlock(); } catch (e) {}
            if (fs.pseudo) {
                document.body.classList.remove('pseudo-fs');
                el.fsExit.hidden = true;
                fs.pseudo = false;
            }
            if (fs.tgFs) {
                try { tg.unlockOrientation(); } catch (e) {}
                try { tg.exitFullscreen(); } catch (e) {}
                fs.tgFs = false;
            }
        }

        // Sortie via les contrôles natifs (Échap, geste retour…)
        function onNativeFsChange() {
            if (fs.active && !fs.pseudo && !document.fullscreenElement && !document.webkitFullscreenElement) {
                exitLandscape();
            }
        }
        document.addEventListener('fullscreenchange', onNativeFsChange);
        document.addEventListener('webkitfullscreenchange', onNativeFsChange);

        el.fs.addEventListener('click', () => (fs.active ? exitLandscape() : enterLandscape()));
        el.fsExit.addEventListener('click', exitLandscape);

        el.select.addEventListener('change', (e) => loadSource(Number(e.target.value)));

        el.player.addEventListener('load', () => {
            if (el.player.getAttribute('src')) hideState();
        });


        async function fetchEpisodeLinks() {
            try {
                const query = new URLSearchParams({
                    animeUrl, seasonUrl, seasonName,
                    ep: String(epNum), lang, animeTitle,
                });
                const response = await fetch(`/api/episodes?${query.toString()}`);
                const data = await response.json();

                if (!data.success || !data.links || !data.links.length) {
                    showState("Aucune source n'est disponible pour cet épisode.", true);
                    return;
                }

                state.links = data.links;
                renderSources();
                loadSource(0);
            } catch (error) {
                console.error(error);
                showState('Impossible de charger l’épisode. Vérifiez votre connexion et réessayez.', true);
            }
        }

        fetchEpisodeLinks();
    </script>
</body>
</html>
