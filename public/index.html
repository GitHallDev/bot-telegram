<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Lecteur Anime</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <main class="page">
        <header class="header">
            <h1 id="animeTitle">Chargement…</h1>
            <p id="episodeMeta" class="meta"></p>
        </header>

        <section class="sources">
            <label class="sr-only" for="sourceSelect">Lecteur</label>
            <select id="sourceSelect" class="select" aria-label="Lecteur">
                <option>Chargement…</option>
            </select>
            <a id="sourceLink" class="source-link" href="#" target="_blank" rel="noopener noreferrer" hidden></a>
        </section>

        <section class="player" id="playerBox">
            <iframe
                id="videoPlayer"
                title="Lecteur vidéo"
                allow="autoplay; fullscreen; picture-in-picture"
                allowfullscreen
                referrerpolicy="no-referrer-when-downgrade"
            ></iframe>
            <div class="player-state" id="playerState">
                <span class="spinner" aria-hidden="true"></span>
                <p>Chargement du lecteur…</p>
            </div>
        </section>


    </main>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            try {
                tg.setHeaderColor('#0d0d0f');
                tg.setBackgroundColor('#0d0d0f');
            } catch (e) { /* version Telegram plus ancienne */ }
        }

        const params = new URLSearchParams(window.location.search);
        const animeUrl = params.get('animeUrl') || '';
        const seasonUrl = params.get('seasonUrl') || '';
        const seasonName = params.get('season') || 'Saison';
        const epNum = parseInt(params.get('ep') || '1', 10) || 1;
        const lang = (params.get('lang') || 'vostfr').toLowerCase();
        const animeTitle = params.get('animeTitle') || 'Anime';

        const el = {
            title: document.getElementById('animeTitle'),
            meta: document.getElementById('episodeMeta'),
            player: document.getElementById('videoPlayer'),
            state: document.getElementById('playerState'),
            select: document.getElementById('sourceSelect'),
            link: document.getElementById('sourceLink'),
        };

        const state = { links: [], active: 0 };

        el.title.textContent = animeTitle;
        el.meta.textContent = `${seasonName} · Épisode ${epNum} · ${lang.toUpperCase()}`;
        document.title = `${animeTitle} – Épisode ${epNum}`;

        function showState(message, isError = false) {
            el.state.hidden = false;
            el.state.classList.toggle('is-error', isError);
            el.state.innerHTML = isError ? '' : '<span class="spinner" aria-hidden="true"></span>';
            const p = document.createElement('p');
            p.textContent = message;
            el.state.appendChild(p);
        }

        function hideState() {
            el.state.hidden = true;
        }

        function renderSources() {
            el.select.innerHTML = '';
            state.links.forEach((link, index) => {
                const opt = document.createElement('option');
                opt.value = String(index);
                opt.textContent = link.host;
                el.select.appendChild(opt);
            });
        }

        function loadSource(index) {
            const link = state.links[index];
            if (!link) return;
            state.active = index;
            const url = link.url.trim();
            el.select.value = String(index);
            el.link.href = url;
            el.link.textContent = url;
            el.link.title = url;
            el.link.hidden = false;
            showState('Chargement du lecteur…');
            el.player.src = url;
        }

        el.select.addEventListener('change', (e) => loadSource(Number(e.target.value)));

        el.player.addEventListener('load', () => {
            if (el.player.getAttribute('src')) hideState();
        });


        async function fetchEpisodeLinks() {
            try {
                const query = new URLSearchParams({
                    animeUrl, seasonUrl, seasonName,
                    ep: String(epNum), lang, animeTitle,
                });
                const response = await fetch(`/api/episodes?${query.toString()}`);
                const data = await response.json();

                if (!data.success || !data.links || !data.links.length) {
                    showState("Aucune source n'est disponible pour cet épisode.", true);
                    return;
                }

                state.links = data.links;
                renderSources();
                loadSource(0);
            } catch (error) {
                console.error(error);
                showState('Impossible de charger l’épisode. Vérifiez votre connexion et réessayez.', true);
            }
        }

        fetchEpisodeLinks();
    </script>
</body>
</html>
