<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Lecteur Anime</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <main class="page">
        <header class="header">
            <h1 id="animeTitle">Chargement…</h1>
            <p id="episodeMeta" class="meta"></p>
        </header>

        <section class="sources">
            <label class="sr-only" for="sourceSelect">Lecteur</label>
            <select id="sourceSelect" class="select" aria-label="Lecteur">
                <option>Chargement…</option>
            </select>
            <div class="source-actions" id="sourceActions" hidden>
                <a id="openBtn" class="icon-btn" href="#" target="_blank" rel="noopener noreferrer" title="Ouvrir la source" aria-label="Ouvrir la source dans un nouvel onglet">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
                </a>
                <button id="copyBtn" class="icon-btn" type="button" title="Copier le lien" aria-label="Copier le lien de la source">
                    <svg class="ico-copy" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg>
                    <svg class="ico-check" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
                </button>
            </div>
        </section>

        <section class="player" id="playerBox">
            <iframe
                id="videoPlayer"
                title="Lecteur vidéo"
                allow="autoplay; fullscreen; picture-in-picture"
                allowfullscreen
                referrerpolicy="no-referrer-when-downgrade"
            ></iframe>
            <div class="player-state" id="playerState">
                <span class="spinner" aria-hidden="true"></span>
                <p>Chargement du lecteur…</p>
            </div>
        </section>


    </main>

    <script>
        const tg = window.Telegram && window.Telegram.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            try {
                tg.setHeaderColor('#0d0d0f');
                tg.setBackgroundColor('#0d0d0f');
            } catch (e) { /* version Telegram plus ancienne */ }
        }

        const params = new URLSearchParams(window.location.search);
        const animeUrl = params.get('animeUrl') || '';
        const seasonUrl = params.get('seasonUrl') || '';
        const seasonName = params.get('season') || 'Saison';
        const epNum = parseInt(params.get('ep') || '1', 10) || 1;
        const lang = (params.get('lang') || 'vostfr').toLowerCase();
        const animeTitle = params.get('animeTitle') || 'Anime';

        const el = {
            title: document.getElementById('animeTitle'),
            meta: document.getElementById('episodeMeta'),
            player: document.getElementById('videoPlayer'),
            state: document.getElementById('playerState'),
            select: document.getElementById('sourceSelect'),
            actions: document.getElementById('sourceActions'),
            open: document.getElementById('openBtn'),
            copy: document.getElementById('copyBtn'),
        };

        const state = { links: [], active: 0 };

        el.title.textContent = animeTitle;
        el.meta.textContent = `${seasonName} · Épisode ${epNum} · ${lang.toUpperCase()}`;
        document.title = `${animeTitle} – Épisode ${epNum}`;

        function showState(message, isError = false) {
            el.state.hidden = false;
            el.state.classList.toggle('is-error', isError);
            el.state.innerHTML = isError ? '' : '<span class="spinner" aria-hidden="true"></span>';
            const p = document.createElement('p');
            p.textContent = message;
            el.state.appendChild(p);
        }

        function hideState() {
            el.state.hidden = true;
        }

        function renderSources() {
            el.select.innerHTML = '';
            state.links.forEach((link, index) => {
                const opt = document.createElement('option');
                opt.value = String(index);
                opt.textContent = link.host;
                el.select.appendChild(opt);
            });
        }

        function loadSource(index) {
            const link = state.links[index];
            if (!link) return;
            state.active = index;
            const url = link.url.trim();
            el.select.value = String(index);
            el.open.href = url;
            el.actions.hidden = false;
            el.copy.classList.remove('is-copied');
            showState('Chargement du lecteur…');
            el.player.src = url;
        }

        async function copyText(text) {
            try {
                await navigator.clipboard.writeText(text);
                return true;
            } catch (e) {
                // Repli pour les WebViews sans API presse-papiers (ex. Telegram)
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.cssText = 'position:fixed;opacity:0;';
                document.body.appendChild(ta);
                ta.select();
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (err) { /* ignoré */ }
                ta.remove();
                return ok;
            }
        }

        let copyTimer;
        el.copy.addEventListener('click', async () => {
            const link = state.links[state.active];
            if (!link) return;
            const ok = await copyText(link.url.trim());
            if (!ok) return;
            el.copy.classList.add('is-copied');
            el.copy.title = 'Lien copié';
            clearTimeout(copyTimer);
            copyTimer = setTimeout(() => {
                el.copy.classList.remove('is-copied');
                el.copy.title = 'Copier le lien';
            }, 1800);
        });

        el.select.addEventListener('change', (e) => loadSource(Number(e.target.value)));

        el.player.addEventListener('load', () => {
            if (el.player.getAttribute('src')) hideState();
        });


        async function fetchEpisodeLinks() {
            try {
                const query = new URLSearchParams({
                    animeUrl, seasonUrl, seasonName,
                    ep: String(epNum), lang, animeTitle,
                });
                const response = await fetch(`/api/episodes?${query.toString()}`);
                const data = await response.json();

                if (!data.success || !data.links || !data.links.length) {
                    showState("Aucune source n'est disponible pour cet épisode.", true);
                    return;
                }

                state.links = data.links;
                renderSources();
                loadSource(0);
            } catch (error) {
                console.error(error);
                showState('Impossible de charger l’épisode. Vérifiez votre connexion et réessayez.', true);
            }
        }

        fetchEpisodeLinks();
    </script>
</body>
</html>
